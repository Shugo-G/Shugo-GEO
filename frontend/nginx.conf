# Detrás de Nginx Proxy Manager (que termina el HTTPS) se respeta el esquema que
# informa el proxy; si se accede directo, se usa el de esta conexión.
map $http_x_forwarded_proto $esquema_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # API y admin de Django
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
        proxy_read_timeout 120s;
    }

    # Estáticos del admin de Django (collectstatic)
    location /static/ {
        alias /static/;
        expires 7d;
    }

    # Los archivos subidos (documentación, planillas de cargo) no se sirven desde acá:
    # sólo se descargan por la API con autenticación.

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

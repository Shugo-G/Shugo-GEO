server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # API y admin de Django
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Estáticos del admin de Django (collectstatic)
    location /static/ {
        alias /static/;
        expires 7d;
    }

    # Fotos de empleados (nombres aleatorios). Es la ÚNICA carpeta de media expuesta:
    # la documentación respaldatoria no se sirve y sólo se descarga por la API con autenticación.
    location /media/fotos/ {
        alias /media-data/fotos/;
        expires 7d;
    }

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

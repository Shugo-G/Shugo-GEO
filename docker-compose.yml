# Despliegue de Shugo-GEO: PostgreSQL + Django (gunicorn) + nginx (frontend y proxy).
# Uso: cp .env.example .env  (editar valores)  &&  docker compose up -d --build
#
# Se publica a través de Nginx Proxy Manager: el frontend se une a su red
# (externa) y NPM le reenvía el tráfico a  shugo-geo:80  (no se publican puertos
# en el host). La base y el backend quedan sólo en la red interna del proyecto.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shugo_geo}
      POSTGRES_USER: ${POSTGRES_USER:-shugo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    networks:
      - interna
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shugo} -d ${POSTGRES_DB:-shugo_geo}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shugo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shugo_geo}
      DJANGO_MEDIA_ROOT: /data/media
    networks:
      - interna
    volumes:
      - media:/data/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - static:/static:ro
    networks:
      interna:
      npm:
        # Nombre con el que NPM encuentra el servicio (Forward Hostname).
        aliases:
          - shugo-geo
    depends_on:
      - backend

networks:
  interna:
  npm:
    external: true
    name: nginx-proxy-manager_npm-net

volumes:
  pgdata:
  media:
  static:
